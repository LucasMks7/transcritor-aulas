[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transcritor-aulas"
description = "Transcreve o áudio de uma aula no próprio PC, sem enviar o áudio para serviços pagos."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Marques de Assis" }]
dynamic = ["version"]
dependencies = [
    "faster-whisper>=1.2",
    # O faster-whisper 1.2.1 abre o áudio com um argumento que o PyAV 19 removeu
    # (metadata_errors). Rever este limite quando o faster-whisper for atualizado.
    "av<19",
    # Já vem com o faster-whisper; declarado porque o projeto o usa diretamente.
    "numpy",
    # Gera o PDF. Python puro, sem bibliotecas nativas para o instalador levar.
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=5"]
# Bibliotecas do CUDA para transcrever na placa de vídeo da NVIDIA. Ocupam cerca
# de 2 GB, por isso ficam de fora da instalação padrão. O CTranslate2 4.x usa o
# CUDA 12 e o cuDNN 9.
gpu = [
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.scripts]
transcrever = "transcritor.cli:main"

# Como gui-script, o Windows abre a janela sem um terminal junto.
[project.gui-scripts]
transcrever-janela = "transcritor.janela:main"

[tool.setuptools.dynamic]
version = { attr = "transcritor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# O teste com o modelo de verdade só roda quando pedido: pytest -m ponta_a_ponta.
addopts = "-m 'not ponta_a_ponta'"
markers = ["ponta_a_ponta: usa o modelo tiny e o áudio de exemplo de verdade"]
